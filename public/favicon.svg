<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#A66BFF"/>
      <stop offset="60%" stop-color="#8A4DFF"/>
      <stop offset="100%" stop-color="#6E36E8"/>
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F4F6"/>
      <stop offset="100%" stop-color="#E6E6EB"/>
    </linearGradient>

    <!-- Check Gradient -->
    <linearGradient id="checkGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A66BFF"/>
      <stop offset="100%" stop-color="#6E36E8"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#4B1DBB" flood-opacity="0.35"/>
    </filter>

    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Purple Rounded Background -->
  <rect x="20" y="20" width="472" height="472" rx="90"
        fill="url(#bgGradient)"
        filter="url(#softShadow)"/>

  <!-- White Calendar Card -->
  <g filter="url(#innerShadow)">
    <rect x="96" y="130" width="320" height="250" rx="40"
          fill="url(#cardGradient)"/>
  </g>

  <!-- Top Separator Line -->
  <line x1="96" y1="200" x2="416" y2="200"
        stroke="#D6D6DC"
        stroke-width="3"/>

  <!-- Top Dots -->
  <circle cx="170" cy="165" r="14" fill="url(#checkGradient)"/>
  <circle cx="342" cy="165" r="14" fill="url(#checkGradient)"/>

  <!-- Checkmark -->
  <path d="M180 275 L240 330 L360 215"
        stroke="url(#checkGradient)"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

</svg>