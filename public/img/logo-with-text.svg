<svg xmlns="http://www.w3.org/2000/svg" width="500" height="100" viewBox="0 0 500 100" id="logo-text-svg">
          <defs>
            <radialGradient id="lt-bg" cx="50%" cy="30%" r="80%">
              <stop offset="0%" stop-color="#A66BFF"/>
              <stop offset="55%" stop-color="#8A4DFF"/>
              <stop offset="100%" stop-color="#6E36E8"/>
            </radialGradient>
            <linearGradient id="lt-check" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#A66BFF"/>
              <stop offset="100%" stop-color="#6E36E8"/>
            </linearGradient>
            <filter id="lt-sh" x="-10%" y="-10%" width="120%" height="130%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4B1DBB" flood-opacity="0.2"/>
            </filter>
          </defs>
          <!-- Icon -->
          <g transform="translate(10,5)">
            <rect width="90" height="90" rx="20" fill="url(#lt-bg)" filter="url(#lt-sh)"/>
            <rect x="16" y="22" width="58" height="49" rx="8" fill="white" fill-opacity="0.95"/>
            <rect x="16" y="22" width="58" height="15" rx="8" fill="#EDECF0"/>
            <rect x="16" y="30" width="58" height="7" fill="#EDECF0"/>
            <circle cx="28" cy="30" r="2.8" fill="url(#lt-check)"/>
            <circle cx="62" cy="30" r="2.8" fill="url(#lt-check)"/>
            <line x1="16" y1="37" x2="74" y2="37" stroke="#D6D6DC" stroke-width="0.8"/>
            <text x="45" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="url(#lt-check)" letter-spacing="-1">
              24
            </text>
            <circle cx="67" cy="63" r="7" fill="url(#lt-check)"/>
            <path d="M62.5 63 L65 65.5 L71.5 59" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>
          <!-- Brand name -->
          <text x="120" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#1e1b2e" letter-spacing="-1">
            Zapys
          </text>
          <text x="247" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#7c3aed" letter-spacing="-1">
            24
          </text>
          <!-- Tagline -->
          <text x="120" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
            Онлайн-запис для бізнесу
          </text>
        </svg>